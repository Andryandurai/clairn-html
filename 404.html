<style>
:root{--mint:#86d3c3;--amber:#ffb45c;--lavender:#b9a3e3;--bg:#101412;--surface:#171d1a;--text:#e8edea;--muted:#b4beb9;--line:#2a3430;--on-accent:#0c1210}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(800px 420px at 85% -60px,rgba(185,163,227,.18),transparent 70%),radial-gradient(700px 400px at 5% -40px,rgba(134,211,195,.16),transparent 70%),var(--bg);color:var(--text);font:17px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{width:min(100%,520px);text-align:center}
.brand{display:inline-flex;align-items:center;gap:12px;min-height:44px;font-weight:700;font-size:1.2rem;color:var(--text);text-decoration:none}
.brand img{width:40px;height:40px;border-radius:10px;display:block}
h1{font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.12;margin:26px 0 10px}
p{color:var(--muted);margin:0 0 24px}
.btn{display:inline-block;min-height:48px;padding:12px 26px;border-radius:999px;background:var(--mint);color:var(--on-accent);font-weight:700;text-decoration:none}
.btn:focus-visible,.brand:focus-visible,.more a:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
.more{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);font-size:.95rem;color:var(--muted)}
.more a{display:inline-block;padding:10px 8px;color:var(--mint)}
</style></head>
